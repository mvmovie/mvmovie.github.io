<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: 'Open Sans', sans-serif; /* Using a more modern font */
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4; /* Light gray background */
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        section {
            margin-bottom: 50px;
        }

        img {
            max-width: 100%;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow */
        }

        .project {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .project-details {
            flex: 1;
            margin-right: 30px; 
        }

        .project-image {
            width: 300px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold; 
        }

        a:hover {
            text-decoration: underline;
        }

        footer {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>My Portfolio</h1>

    <section>
        <h2>About Me</h2>
        <p>YO SOY MVMOVIE Y TRAIFO PELICULAS</p>
    </section>

    <section>
        <h2>projecto</h2>
        <div class="project">
            <div class="project-details">
                <h3>Project 1: pelis</h3>
                <p>[pelis]</p>
            </div>
            <div class="project-image">
                <img src="images/project1.jpg" alt="Project 1 Image">
            </div>
        </div>

        <div class="project">
            <div class="project-details">
                <h3>projecto 2: [st pelicyla]</h3>
                <p>[ser mejor que stpelicula ion]</p>
            </div>
            <div class="project-image">
                <img src="images/project2.jpg" alt="Project 2 Image">
            </div>
        </div>

    </section>

    <section>
        <h2>Contact</h2>
        <p>me contactas en youtube y github</p>
        <ul>
            <li>GitHub: <a href"github.com/mvmovie">mvmovie</a></li>
        </ul>
    </section>

    <footer>
        &copy; mvmovie - stpelicula
    </footer>

</body>
</html>
